<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrega+ | Sistema de Gerenciamento</title>
    <style>
        /* Estilo básico imitando o protótipo do Figma */
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
        header { background-color: #2ecc71; color: white; padding: 15px; text-align: center; font-size: 24px; font-weight: bold; }
        .container { max-width: 400px; margin: 50px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        form p { margin-bottom: 15px; }
        input[type="text"], input[type="password"], input[type="email"] {
            width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
        }
        button { width: 100%; padding: 10px; background-color: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #27ae60; }
        .link { text-align: center; margin-top: 15px; display: block; color: #2ecc71; text-decoration: none; }
    </style>
</head>
<body>
    <header>Entrega+</header>
    
    <div class="container">
        {% block content %}
        <!-- O conteúdo das outras páginas vai aparecer aqui -->
        {% endblock %}
    </div>
</body>
</html>
