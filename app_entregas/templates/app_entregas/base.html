<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrega+ | Sistema de Gerenciamento</title>
    
    <style>
     
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /*Estilização beleza do site */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; color: #333; }
        
        /*CABEÇALHO Header*/
        header { background-color: #2ecc71; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        header h1 { font-size: 24px; }
        header a { color: white; text-decoration: none; margin-left: 15px; font-weight: bold; font-size: 14px; }
        header a:hover { text-decoration: underline; }

        /*Container*/
        .container { max-width: 800px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        
        /*formulários Padronização dos campos */
        form p { margin-bottom: 15px; display: flex; flex-direction: column; }
        form label { font-weight: bold; margin-bottom: 5px; color: #555; }
        input[type="text"], input[type="password"], input[type="email"] {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px;
        }
        
        /*BOTÕES Efeito de transição suave ao passar o mouse */
        button { width: 100%; padding: 12px; background-color: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        
        .link { text-align: center; margin-top: 15px; display: block; color: #2ecc71; text-decoration: none; font-weight: bold; }
        .link:hover { text-decoration: underline; }

        /*TABELAS Estilo para as listagens de pedidos e rotas */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #2c3e50; font-weight: bold; }
        tr:hover { background-color: #f1f1f1; }

        /*BADGES pilulas de status Cores dinâmicas para os status do sistema */
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; color: white; }
        .bg-warning { background-color: #f39c12; }
        .bg-info { background-color: #3498db; }
        .bg-success { background-color: #2ecc71; }
        .bg-danger { background-color: #e74c3c; }
    </style>
</head>
<body>
    <!-- CABEÇALHO O bloco if user.is_authenticated
      do Django garante que o menu só apareça se o usuário estiver logado-->
    <header>
        <h1>Entrega+</h1>
        <div>
            {% if user.is_authenticated %}
                <span>Olá, {{ user.username }}</span>
                <a href="{% url 'dashboard' %}">Painel</a>
                <a href="/admin/logout/">Sair</a>
            {% endif %}
        </div>
    </header>

    <!-- O bloco 'content' é a base da herança de templates do Django 
         Todas as outras páginas login cadastro  dashboard irão "estender este arquivo
          e injetar o próprio código HTML dentro deste bloco -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
